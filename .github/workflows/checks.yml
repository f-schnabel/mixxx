# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: build-checks

on:
  workflow_call:

permissions:
  contents: read #  to fetch code (actions/checkout)

jobs:
  build-checks:
    permissions:
      contents: read #  to fetch code (actions/checkout)
      checks: write #  to create new checks (coverallsapp/github-action)

    strategy:
      matrix:
        include:
          - name: clazy
          - name: clang-tidy
          - name: coverage
    runs-on: ubuntu-22.04
    name: ${{ matrix.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: tools/debian_buildenv.sh setup
      - name: Create build directory
        run: mkdir build
      - name: Configure (clazy)
        if: matrix.name == 'clazy'
        # Disable optimizations as workaround for Clang 9 bug: https://bugs.llvm.org/show_bug.cgi?id=45034
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWARNINGS_FATAL=ON \
            -DQT6=ON \
            -DOPTIMIZE=off \
            -DBATTERY=ON \
            -DBROADCAST=ON \
            -DBULK=ON \
            -DHID=ON \
            -DLILV=ON \
            -DOPUS=ON \
            -DQTKEYCHAIN=ON \
            -DVINYLCONTROL=ON \
            -DFFMPEG=ON \
            -DKEYFINDER=ON \
            -DLOCALECOMPARE=ON \
            -DMAD=ON \
            -DMODPLUG=ON \
            -DWAVPACK=ON \
            ..
        working-directory: build
        env:
          LD: clang++
          CC: clang
          CXX: clazy
      - name: Configure (clang-tidy)
        if: matrix.name == 'clang-tidy'
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCLANG_TIDY=clang-tidy \
            -DWARNINGS_FATAL=ON \
            -DQT6=ON \
            -DBATTERY=ON \
            -DBROADCAST=ON \
            -DBULK=ON \
            -DHID=ON \
            -DLILV=ON \
            -DOPUS=ON \
            -DQTKEYCHAIN=ON \
            -DVINYLCONTROL=ON \
            -DFFMPEG=ON \
            -DKEYFINDER=ON \
            -DLOCALECOMPARE=ON \
            -DMAD=ON \
            -DMODPLUG=ON \
            -DWAVPACK=ON \
            ..
        working-directory: build
        env:
          LD: clang++
          CC: clang
          CXX: clang++
      - name: Configure (coverage)
        if: matrix.name == 'coverage'
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DOPTIMIZE=off \
            -DQT6=ON \
            -DCOVERAGE=ON \
            -DWARNINGS_FATAL=OFF \
            -DDEBUG_ASSERTIONS_FATAL=OFF \
            -DBATTERY=ON \
            -DBROADCAST=ON \
            -DBULK=ON \
            -DHID=ON \
            -DLILV=ON \
            -DOPUS=ON \
            -DQTKEYCHAIN=ON \
            -DVINYLCONTROL=ON \
            -DFFMPEG=ON \
            -DKEYFINDER=ON \
            -DLOCALECOMPARE=ON \
            -DMAD=ON \
            -DMODPLUG=ON \
            -DWAVPACK=ON \
            ..
        working-directory: build
      - name: Set up problem matcher
        uses: ammaraskar/gcc-problem-matcher@0.3.0
      - name: Restore ccache cache
        # Caches are only saved by push builds (see "Save ccache cache").
        # Pull requests can read caches of their base branch, but caches they
        # save are only visible to themselves and evict the base branch caches
        # from the 10 GB repository quota.
        id: ccache_cache
        if: matrix.name != 'clang-tidy'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          # Key by source state (not run number). This workflow is part of the
          # key because clazy hashes it (see "Set up ccache for clazy"), an
          # exact hit would otherwise keep a stale cache that is never saved.
          key: ubuntu-22.04-${{ matrix.name }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles('src/**', 'CMakeLists.txt', 'cmake/**', '.github/workflows/checks.yml') }}
          restore-keys: |
            ubuntu-22.04-${{ matrix.name }}-${{ github.head_ref || github.ref_name }}
            ubuntu-22.04-${{ matrix.name }}-${{ github.base_ref }}
            ubuntu-22.04-${{ matrix.name }}
      - name: Set up ccache
        if: matrix.name != 'clang-tidy'
        run: |
          ccache --zero-stats
          ccache --max-size=2G
      - name: Set up ccache for clazy
        if: matrix.name == 'clazy'
        run: |
          # clazy is a clang wrapper that ccache does not recognize by name
          ccache --set-config=compiler_type=clang
          # The wrapper script does not change when clang or the clazy plugin do
          ccache --set-config=compiler_check='%compiler% --version'
          # ccache does not see CLAZY_CHECKS and CLAZY_IGNORE_DIRS, hash the file that sets them
          ccache --set-config=extra_files_to_hash="$PWD/.github/workflows/checks.yml"
      - name: Build
        # Do not abort on errors and build/check the whole project
        run: cmake --build . -j $(nproc) -- --keep-going
        working-directory: build
        env:
          CLAZY_CHECKS: level2,container-inside-loop,heap-allocated-small-trivial-type,isempty-vs-count,qhash-with-char-pointer-key,qproperty-type-mismatch,tr-non-literal,no-rule-of-two-soft,no-non-pod-global-static,no-qproperty-without-notify,no-qstring-allocations,no-function-args-by-value,no-copyable-polymorphic,no-ctor-missing-parent-argument,no-missing-qobject-macro,no-rule-of-three,no-returning-void-expression
          CLAZY_IGNORE_DIRS: lib/.*
      - name: Print ccache stats
        if: matrix.name != 'clang-tidy' && !cancelled()
        run: |
          ccache --show-stats
          ccache --cleanup
      - name: Save ccache cache
        # Also save after failed builds, the files that compiled are still cached
        if: >-
          matrix.name != 'clang-tidy' && !cancelled() &&
          steps.ccache_cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' && github.ref_type == 'branch'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache_cache.outputs.cache-primary-key }}
      - name: "Test"
        if: matrix.name == 'coverage'
        run: ctest --timeout 45
        working-directory: build
        env:
          # Render analyzer waveform tests to an offscreen buffer
          QT_QPA_PLATFORM: ${{ matrix.qt_qpa_platform }}
          GTEST_COLOR: 1
          # Only use single thread to prevent *.gcna files from overwriting each other
          CTEST_PARALLEL_LEVEL: 1
          CTEST_OUTPUT_ON_FAILURE: 1
      - name: "Generate Coverage Report"
        if: matrix.name == 'coverage'
        run: >-
          lcov
          --capture
          --directory .
          --base-directory ..
          --include "${PWD%/*}/src/*"
          --exclude "${PWD%/*}/src/test/*"
          --exclude "${PWD%/*}/build/*"
          --exclude "${PWD%/*}/lib/*"
          --output-file lcov.info
        working-directory: build
      - name: "Upload Coverage Report to coveralls.io"
        if: matrix.name == 'coverage'
        continue-on-error: true
        uses: coverallsapp/github-action@v2.3.8
        with:
          flag-name: ubuntu-22.04
          path-to-lcov: build/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
